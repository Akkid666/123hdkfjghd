<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Private File Share</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="top">
      <div><p class="eyebrow">PRIVATE STORAGE</p><h1>Your files</h1></div>
      <button id="logout" class="button secondary hidden">Log out</button>
    </header>

    <section id="login-panel" class="panel">
      <h2>Sign in</h2>
      <p class="muted">Enter your private access password to view and download files.</p>
      <form id="login-form">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="button" type="submit">Sign in</button>
        <p id="login-error" class="error" role="status"></p>
      </form>
    </section>

    <section id="files-panel" class="panel hidden">
      <div class="section-heading">
        <div><h2>Available files</h2><p class="muted">Only files uploaded to your private store appear here.</p></div>
        <a class="button" href="/upload.html">Upload files</a>
      </div>
      <div id="file-list" class="file-list"><p class="muted">Loading…</p></div>
      <p id="list-error" class="error" role="status"></p>
    </section>
    <footer>Private downloads are served through authenticated server routes.</footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
